<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addictive Salad — Arma tu ensalada</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper: #F1EDCC;
  --paper-dim: #E3DEB2;
  --forest: #2C6577;
  --forest-soft: #3F7F92;
  --accent: #7FA467;
  --accent-light: #B7D48B;
  --sky: #9FE2F2;
  --ink: #263029;
  --ink-soft: #62695F;
  --card: #FCFBF0;
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap{
  max-width: 1040px;
  margin: 0 auto;
  padding: 36px 20px 80px;
}

/* ---------- Header ---------- */
header{
  display:flex;
  flex-direction: column;
  align-items:flex-start;
  gap: 6px;
  margin-bottom: 28px;
  border-bottom: 2px solid var(--forest);
  padding-bottom: 20px;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
h1{
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: clamp(32px, 5vw, 52px);
  margin: 0;
  color: var(--forest);
  letter-spacing: -0.01em;
}
.sub{
  font-size: 14.5px;
  color: var(--ink-soft);
  max-width: 520px;
  line-height: 1.5;
}

/* ---------- Layout ---------- */
.layout{
  display:grid;
  grid-template-columns: 1fr 320px;
  gap: 28px;
  align-items: start;
}
@media (max-width: 860px){
  .layout{ grid-template-columns: 1fr; }
  .ticket{ position: static !important; order: -1; }
}

/* ---------- Section cards ---------- */
.section{
  background: var(--card);
  border: 1px solid var(--paper-dim);
  border-radius: 4px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: box-shadow .25s ease;
}
.section.done{
  border-color: var(--forest-soft);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  gap: 12px;
}
.section-head:hover .sec-title{ color: var(--accent); }

.sec-title-wrap{
  display:flex;
  align-items:baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.sec-title{
  font-family:'Fraunces', serif;
  font-weight: 600;
  font-size: 20px;
  color: var(--forest);
  transition: color .2s ease;
}
.sec-max{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
}
.sec-count{
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 100px;
  background: var(--paper-dim);
  color: var(--ink-soft);
  white-space: nowrap;
}
.sec-count.full{
  background: var(--forest);
  color: var(--paper);
}
.chevron{
  width: 18px; height: 18px;
  flex-shrink: 0;
  transition: transform .25s ease;
  color: var(--ink-soft);
}
.section.collapsed .chevron{ transform: rotate(-90deg); }

.section-summary{
  display:none;
  padding: 0 20px 16px;
  font-size: 13.5px;
  color: var(--forest-soft);
  font-style: italic;
}
.section.collapsed .section-summary{ display:block; }

.section-body{
  padding: 4px 20px 18px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px 18px;
}
@media (max-width: 480px){
  .section-body{ grid-template-columns: 1fr; }
}
.section.collapsed .section-body{ display:none; }

.opt{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 7px 4px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14.5px;
  line-height: 1.3;
  transition: opacity .15s ease;
}
.opt.disabled{
  opacity: 0.35;
  cursor: not-allowed;
}
.opt input{
  appearance: none;
  -webkit-appearance:none;
  width: 17px; height: 17px;
  min-width:17px;
  border: 1.5px solid var(--ink-soft);
  border-radius: 3px;
  position: relative;
  cursor: inherit;
  background: var(--card);
  flex-shrink:0;
}
.opt input:checked{
  background: var(--forest);
  border-color: var(--forest);
}
.opt input:checked::after{
  content:'';
  position: absolute;
  left: 5px; top: 1.5px;
  width: 4px; height: 9px;
  border: solid var(--paper);
  border-width: 0 2px 2px 0;
  transform: rotate(40deg);
}
.opt label{
  cursor: inherit;
}
.opt input:checked ~ label{
  color: var(--forest);
  font-weight: 600;
}

.limit-msg{
  padding: 0 20px 14px;
  font-size: 12.5px;
  color: var(--forest-soft);
  font-family: 'IBM Plex Mono', monospace;
  display:none;
}
.limit-msg.show{ display:block; }

/* ---------- Ticket ---------- */
.ticket{
  position: sticky;
  top: 24px;
  background: var(--card);
  border: 1px dashed var(--forest-soft);
  border-radius: 2px;
  padding: 22px 20px 20px;
  font-family: 'IBM Plex Mono', monospace;
}
.ticket-head{
  text-align:center;
  border-bottom: 1px dashed var(--paper-dim);
  padding-bottom: 12px;
  margin-bottom: 12px;
}
.ticket-head .name{
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 19px;
  color: var(--forest);
}
.ticket-head .tag{
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 3px;
}
.ticket-base{
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--paper-dim);
}
.ticket-base .ticket-group-title{ color: var(--forest-soft); }
.ticket-base .ticket-item::before{ content: '✓ '; color: var(--forest); }
.ticket-group{ margin-bottom: 12px; }
.ticket-group-title{
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 4px;
}
.ticket-item{
  font-size: 13px;
  color: var(--ink);
  display:flex;
  justify-content: space-between;
  padding: 1px 0;
}
.ticket-item::before{
  content:'· ';
  color: var(--forest-soft);
}
.ticket-empty{
  font-size: 12.5px;
  color: var(--ink-soft);
  font-style: italic;
  text-align:center;
  padding: 10px 0;
}
.ticket-progress{
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--paper-dim);
  font-size: 11.5px;
  color: var(--ink-soft);
  text-align:center;
}
.ticket-progress strong{ color: var(--forest); }

.reset-btn{
  margin-top: 14px;
  width: 100%;
  background: none;
  border: 1px solid var(--forest-soft);
  color: var(--forest-soft);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 9px 0;
  border-radius: 2px;
  cursor: pointer;
  transition: all .15s ease;
}
.reset-btn:hover{
  background: var(--forest-soft);
  color: var(--paper);
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Menú personalizable</div>
    <h1>Addictive Salad</h1>
    <p class="sub">Marca tus favoritos en cada set — hasta el máximo indicado entre paréntesis. Cuando completes una sección, se guarda y se contrae sola, y tu pedido va apareciendo en el ticket de la derecha.</p>
  </header>

  <div class="layout">
    <div class="sections" id="sections"></div>

    <aside class="ticket">
      <div class="ticket-head">
        <div class="name">Tu pedido</div>
        <div class="tag">Addictive Salad</div>
      </div>
      <div class="ticket-base">
        <div class="ticket-group-title">Base</div>
        <div class="ticket-item"><span>Lechuga</span></div>
      </div>
      <div id="ticketBody"><div class="ticket-empty">Aún no has elegido nada más</div></div>
      <div class="ticket-progress" id="ticketProgress"></div>
      <button class="reset-btn" id="resetBtn">Empezar de nuevo</button>
    </aside>
  </div>

</div>

<script>
const DATA = [
  { key: 'vegetales', title: 'Vegetales', max: 5, items: ['Tomate','Cebolla morada','Cebolla blanca','Apio','Pepino','Pimentón','Zanahoria','Repollo blanco','Repollo morado','Rábano','Palta','Arvejas','Palmito','Rúcula','Espinaca','Manzana verde','Frutilla','Mango'] },
  { key: 'carbos', title: 'Carbos', max: 1, items: ['Quinua','Trigo','Fideo','Camote','Garbanzo','Poroto negro','Poroto blanco','Choclitos'] },
  { key: 'proteina', title: 'Proteína', max: 3, items: ['Pollo grill','Milanesa de carne','Lomo ahumado','Nuggets de pollo','Chicken tenders','Jamón','Pechuga de pavo','Atún','Queso mozzarella','Huevo','Milanesa de avena','Milanesa de soya','Tocino'] },
  { key: 'topping', title: 'Topping', max: 2, items: ['Champiñones','Pepinillos','Aceituna verde','Aceituna negra','Jalapeños','Crutones','Nachos','Uvas pasas','Nueces','Maní','Almendras','Avena','Sésamo','Chia','Semillas de girasol','Cilantro','Perejil','Quirquiña'] },
  { key: 'salsas', title: 'Salsas', max: 2, items: ['Apio/ajo','Cesar','Queso azul','Golf','Alfredo','Honey mustard (Miel mostaza)','Teriyaki','Ranch (Yogurt griego)','Pesto','Palta','Maní picante','Vinagreta de mostaza','Vinagreta balsámica','Llajua'] }
];

const state = {};
DATA.forEach(sec => state[sec.key] = new Set());

const sectionsEl = document.getElementById('sections');

function slug(key, item){
  return key + '__' + item.replace(/[^a-zA-Z0-9]/g,'');
}

function render(){
  sectionsEl.innerHTML = '';
  DATA.forEach(sec => {
    const selectedCount = state[sec.key].size;
    const isFull = selectedCount === sec.max;
    const collapsed = isFull;

    const secEl = document.createElement('div');
    secEl.className = 'section' + (isFull ? ' done' : '') + (collapsed ? ' collapsed' : '');
    secEl.dataset.key = sec.key;

    secEl.innerHTML = `
      <div class="section-head">
        <div class="sec-title-wrap">
          <span class="sec-title">${sec.title}</span>
          <span class="sec-max">(máx ${sec.max})</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="sec-count ${isFull ? 'full' : ''}">${selectedCount}/${sec.max}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="section-summary">${selectedCount ? [...state[sec.key]].join(', ') : 'Sin selección'}</div>
      <div class="section-body">
        ${sec.items.map(item => {
          const id = slug(sec.key, item);
          const checked = state[sec.key].has(item);
          const disabled = !checked && selectedCount >= sec.max;
          return `
          <div class="opt ${disabled ? 'disabled' : ''}" data-item="${item}">
            <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
            <label for="${id}">${item}</label>
          </div>`;
        }).join('')}
      </div>
      <div class="limit-msg">Ya elegiste el máximo de ${sec.title.toLowerCase()} (${sec.max}). Desmarca uno para cambiar.</div>
    `;

    // header click toggles collapse manually
    secEl.querySelector('.section-head').addEventListener('click', () => {
      secEl.classList.toggle('collapsed');
    });

    // checkbox interactions
    secEl.querySelectorAll('.opt').forEach(optEl => {
      const item = optEl.dataset.item;
      const input = optEl.querySelector('input');
      optEl.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT') {
          if (input.disabled) return;
        }
        e.preventDefault();
        if (input.disabled && !input.checked) {
          flashLimit(secEl);
          return;
        }
        if (state[sec.key].has(item)) {
          state[sec.key].delete(item);
        } else {
          if (state[sec.key].size >= sec.max) { flashLimit(secEl); return; }
          state[sec.key].add(item);
        }
        render();
        renderTicket();
      });
    });

    sectionsEl.appendChild(secEl);
  });
}

function flashLimit(secEl){
  const msg = secEl.querySelector('.limit-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 1600);
}

function renderTicket(){
  const body = document.getElementById('ticketBody');
  const groupsWithItems = DATA.filter(sec => state[sec.key].size > 0);

  if (groupsWithItems.length === 0){
    body.innerHTML = '<div class="ticket-empty">Aún no has elegido nada más</div>';
  } else {
    body.innerHTML = groupsWithItems.map(sec => `
      <div class="ticket-group">
        <div class="ticket-group-title">${sec.title}</div>
        ${[...state[sec.key]].map(item => `<div class="ticket-item"><span>${item}</span></div>`).join('')}
      </div>
    `).join('');
  }

  const totalMax = DATA.reduce((a,s) => a + s.max, 0);
  const totalSel = DATA.reduce((a,s) => a + state[s.key].size, 0);
  const allDone = DATA.every(s => state[s.key].size === s.max);
  document.getElementById('ticketProgress').innerHTML = allDone
    ? `<strong>¡Pedido completo!</strong> ${totalSel}/${totalMax} ítems`
    : `<strong>${totalSel}</strong>/${totalMax} ítems seleccionados`;
}

document.getElementById('resetBtn').addEventListener('click', () => {
  DATA.forEach(sec => state[sec.key].clear());
  render();
  renderTicket();
});

render();
renderTicket();
</script>
</body>
</html>
